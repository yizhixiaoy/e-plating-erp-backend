spring:
  datasource:
    url: jdbc:mysql://test-mysql:3306/e_plating_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: test
    password: test
    druid:
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:test-redis}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}  # 测试环境SMTP服务器
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:false}
          ssl:
            enable: ${MAIL_SSL_ENABLED:false}  # 测试环境禁用SSL,覆盖base配置

# 测试环境OSS配置
oss:
  provider: ${OSS_PROVIDER:minio}
  
  # 腾讯云COS（测试环境）
  tencent:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ${TENCENT_REGION:ap-guangzhou}
    bucket: ${TENCENT_BUCKET:erp-test}
  
  # 阿里云OSS（测试环境）
  aliyun:
    endpoint: ${ALIYUN_ENDPOINT:}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    bucket: ${ALIYUN_BUCKET:erp-test}
  
  # MinIO（测试环境）
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:erp-test}
    region: ${MINIO_REGION:}
    domain: ${MINIO_DOMAIN:}
    connection-timeout: ${MINIO_CONNECTION_TIMEOUT:30000}
    socket-timeout: ${MINIO_SOCKET_TIMEOUT:30000}
    secure: ${MINIO_SECURE:false}

# 测试环境邮件配置
app:
  jwt:
    secret: ${JWT_SECRET:test-jwt-secret-at-least-32-characters}
    expire-seconds: 7200
    refresh-expire-seconds: 604800
  authz:
    cache-seconds: ${AUTHZ_CACHE_SECONDS:120}
  message:
    publish-check-ms: ${MESSAGE_PUBLISH_CHECK_MS:30000}
  mail:
    enabled: ${MAIL_ENABLED:false}  # 测试环境默认禁用
    from: ${MAIL_FROM:noreply@zhiduyun.com}
    login-url: ${MAIL_LOGIN_URL:http://test.zhiduyun.com/login}
  # 短信配置(测试环境默认禁用)
  sms:
    enabled: ${SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:aliyun}
    aliyun:
      access-key-id: ${SMS_ACCESS_KEY_ID:}
      access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
      sign-name: ${SMS_SIGN_NAME:}
      template-code: ${SMS_TEMPLATE_CODE:}
      endpoint: ${SMS_ENDPOINT:https://dysmsapi.aliyuncs.com}
