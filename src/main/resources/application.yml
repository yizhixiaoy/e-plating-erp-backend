server:
  port: 8080

spring:
  application:
    name: e-plating-erp-backend
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: ${DB_URL:jdbc:mysql://localhost:3306/e_plating_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
#    sql变更检测
#    validate-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.plating: debug
#    root: debug

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisJwtSecretAtLeast32Chars!}
#    2小时
    expire-seconds: 7200
#    7天
    refresh-expire-seconds: 604800
  authz:
    cache-seconds: ${AUTHZ_CACHE_SECONDS:120}
  message:
    publish-check-ms: ${MESSAGE_PUBLISH_CHECK_MS:60000}

