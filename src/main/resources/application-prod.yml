spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:12679}
  mail:
    host: ${MAIL_HOST}  # 必须配置SMTP服务器地址
    port: ${MAIL_PORT:465}  # SSL端口465或STARTTLS端口587
    username: ${MAIL_USERNAME}  # 必须配置邮箱账号
    password: ${MAIL_PASSWORD}  # 必须配置邮箱密码或授权码
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}  # 生产环境必须开启认证
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}  # 生产环境必须开启SSL
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory

# 生产环境OSS配置（默认腾讯云，生产环境必须配置环境变量）
oss:
  provider: ${OSS_PROVIDER:tencent}
  
  # 腾讯云COS（生产环境）
  tencent:
    secret-id: ${TENCENT_SECRET_ID}
    secret-key: ${TENCENT_SECRET_KEY}
    region: ${TENCENT_REGION:ap-guangzhou}
    bucket: ${TENCENT_BUCKET}
  
  # 阿里云OSS（生产环境）
  aliyun:
    endpoint: ${ALIYUN_ENDPOINT}
    access-key-id: ${ALIYUN_ACCESS_KEY_ID}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET}
    bucket: ${ALIYUN_BUCKET}
  
  # MinIO（生产环境私有部署）
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET}
    region: ${MINIO_REGION}
    domain: ${MINIO_DOMAIN}
    connection-timeout: ${MINIO_CONNECTION_TIMEOUT:30000}
    socket-timeout: ${MINIO_SOCKET_TIMEOUT:30000}
    secure: ${MINIO_SECURE:true}

# 生产环境邮件配置（必须配置环境变量）
app:
  jwt:
    secret: ${JWT_SECRET}
    expire-seconds: 7200
    refresh-expire-seconds: 604800
  authz:
    cache-seconds: ${AUTHZ_CACHE_SECONDS:120}
  message:
    publish-check-ms: ${MESSAGE_PUBLISH_CHECK_MS:60000}
  # AI助理配置（生产环境必须通过环境变量配置）
  ai:
    service-url: ${AI_SERVICE_URL}  # 必须配置，如 http://ai-python:8000
    internal-api-key: ${AI_INTERNAL_API_KEY}  # 必须配置，与Python端JAVA_API_KEY一致
  mail:
    enabled: ${MAIL_ENABLED:true}  # 生产环境默认启用
    from: ${MAIL_FROM}  # 必须配置,如 noreply@zhiduyun.com
    login-url: ${MAIL_LOGIN_URL:https://www.zhiduyun.com/login}  # 生产环境登录地址
  # 短信配置(生产环境默认启用,必须配置环境变量)
  sms:
    enabled: ${SMS_ENABLED:true}
    provider: ${SMS_PROVIDER:aliyun}
    aliyun:
      access-key-id: ${SMS_ACCESS_KEY_ID}  # 必须配置
      access-key-secret: ${SMS_ACCESS_KEY_SECRET}  # 必须配置
      sign-name: ${SMS_SIGN_NAME}  # 必须配置
      template-code: ${SMS_TEMPLATE_CODE}  # 必须配置
      endpoint: ${SMS_ENDPOINT:https://dysmsapi.aliyuncs.com}
